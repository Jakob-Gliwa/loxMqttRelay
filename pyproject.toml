[build-system]
requires = ["setuptools", "setuptools-rust"]
build-backend = "setuptools.build_meta"


[project]
name = "loxmqttrelay"
version = "0.3.0"
description = "MQTT Relay for Loxone"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "orjson>=3.11.9",
    "pycryptodome>=3.23.0",
    "uvloop>=0.22.1",
    "construct>=2.10.70",
    "tomlkit>=0.15.0",
    "lxml>=6.1.1",
    "loxwebsocket>=0.6.0",
    "lz4>=4.4.5",
    "pygixml>=0.11.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0"
]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyinstrument>=5.1.2",
    "setuptools>=82.0.1", 
    "setuptools-rust>=1.12.1"
]
build = [
    "setuptools>=82.0.1",
    "setuptools-rust>=1.12.1"
]

[tool.uv]
system-certs = true

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["loxmqttrelay"]

[project.scripts]
loxmqttrelay = "loxmqttrelay.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = '-v --cov=loxmqttrelay --cov-report=term-missing -m "not harness"'
markers = [
    "harness: developer-driven tests against the mock Miniserver; run with -m harness",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
