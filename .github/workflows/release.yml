name: Release (Publish to Docker Hub)

# The only workflow that publishes versioned tags and moves :latest. Triggered
# when a GitHub Release is published; the image tags are derived from the
# release's semver tag, e.g. "v0.3.0" -> 0.3.0, 0.3, latest.
#
# A prerelease tag such as "v0.4.0-rc1" publishes only its own immutable
# :0.4.0-rc1 and touches neither :latest nor :0.4 (see the merge stage).
#
# Everything on main lands on the :experimental channel via ci.yml instead.

on:
  release:
    types: [published]

# Never cancel a release run: a half-pushed manifest is worse than a slow queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/loxmqttrelay

jobs:
  # --- TEST STAGE (gate the release on green tests; mirrors ci.yml) ---
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Sync dependencies (incl. test extras)
        run: uv sync --locked --extra test

      # The UDP path and the MQTT client are Rust; their unit tests live in the
      # crate. Built without `extension-module`, so the harness links libpython
      # itself - PYO3_PYTHON points it at the interpreter uv just provisioned.
      - name: Run Rust tests
        run: cargo nextest run
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python

      - name: Run tests with coverage
        run: uv run pytest --cov-report=xml

  # --- VERSION GATE (git tag must match pyproject, __version__ and Cargo.toml) ---
  # The image tags come from the release's git tag via type=semver below. If
  # someone tags v0.4.0 but forgets to bump the code, the image would advertise
  # 0.4.0 while the relay reports 0.3.0. Fail the release loudly instead.
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      # --no-project: the script reads the files and imports nothing, so it needs
      # neither the dependencies nor a compiled extension.
      - name: Assert release tag == pyproject == __version__ == Cargo.toml
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --no-project python scripts/check_version_parity.py "$RELEASE_TAG"

  # --- BUILD STAGE (one native runner per platform, no QEMU) ---
  build:
    # Gate the published image on tests AND version parity: a mismatch must not
    # be able to ship an image that misreports its own version.
    needs: [test, version-check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Check out source
        uses: actions/checkout@v6

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # --- MERGE STAGE (assemble the multi-arch manifest, tag & push) ---
  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest=auto (the default, stated so the contract is visible): the
          # moving :latest is emitted only for a stable semver. Together with
          # type=semver, which suppresses the :{{major}}.{{minor}} partial on a
          # prerelease, a tag like v0.4.0-rc1 publishes just its own immutable
          # :0.4.0-rc1 and clobbers neither :latest nor :0.4.
          flavor: |
            latest=auto
          # Derived from the release tag (refs/tags/<tag>). A stable tag like
          # "v0.3.0" yields 0.3.0, 0.3 and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          mapfile -t TAG_ARGS < <(jq -r '.tags[] | "-t\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t ANN_ARGS < <(jq -r '.annotations[]? | "--annotation\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ "${#TAG_ARGS[@]}" -eq 0 ]; then
            echo "No tags resolved. Nothing to push." >&2
            exit 1
          fi
          SOURCES=()
          for digest in *; do
            SOURCES+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create "${TAG_ARGS[@]}" "${ANN_ARGS[@]}" "${SOURCES[@]}"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image
        run: |
          set -euo pipefail
          first_tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$first_tag"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

  # --- RETRACT ON FAILURE (best-effort un-publish) ---
  # A release:[published] trigger means the GitHub Release is already public
  # before any gate has run. If validation, the image build or the manifest push
  # fails, turn the release back into a draft so no broken or image-less release
  # is left visible. This narrows the public window but cannot close it - only
  # creating the release at the end of a tag-driven run would.
  retract-on-failure:
    needs: [test, version-check, build, merge]
    # Run only when something upstream actually failed or was cancelled.
    if: >-
      always()
      && (contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Least privilege: only this job may write repo contents (edit the release).
    permissions:
      contents: write
    steps:
      - name: Convert release back to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          echo "::warning::A release gate failed — retracting release '${RELEASE_TAG}' (id ${RELEASE_ID}) back to draft."
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=true
