[package]
name = "loxmqttrelay"
version = "0.4.0"
edition = "2024"

[lib]
name = "loxmqttrelay"

[[bin]]
# The relay itself. Named `-relay` because on x86 a small launcher takes the
# plain `loxmqttrelay` name and execs whichever of the two builds this CPU can
# run; see src/launcher.rs. The image installs it under two names, one built for
# `x86-64-v3` and one for the baseline.
name = "loxmqttrelay-relay"
path = "src/main.rs"

[[bin]]
# The AVX2 check, compiled for the baseline so it can run anywhere and look
# before the optimized build would have faulted. Unix only: it exists to `exec`.
name = "loxmqttrelay"
path = "src/launcher.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Replaces the `strip --strip-unneeded` step the Dockerfile used to run.
strip = "symbols"
# panic stays "unwind": udp.rs inspects `JoinError::is_panic` to tell a cancelled
# receive loop from one that died, and "abort" would turn the second into a dead
# process instead of a reported one.
panic = "unwind"

[dependencies]
regex = "1.12.3"
lru = "0.18.0"          # LRU cache
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
log = "0.4.32"
env_logger = "0.11.10"     
tokio = { version = "1.52.3", features = ["full"] }
base64 = "0.22.1"
# Pin the rustls crypto provider explicitly: exactly one is required, and `ring`
# builds without cmake/NASM on the ARM targets this ships to.
mqtt-glide = { version = "0.1.1", default-features = false, features = ["tls-rustls-ring"] }
# The Miniserver websocket. Same rustls/ring provider as mqtt-glide above, so
# the graph keeps exactly one of each; `cargo tree -d` is what checks that.
loxwebsocket = "0.2.0"
arc-swap = "1.9"
# The topic and payload types glide's publish builder takes. Named here so a
# publish can hand its buffers over instead of being copied into them; the
# majors are the ones mqtt-glide already resolves, so the graph keeps one of each.
bytes = "1.12"
bytestring = "1.5"
# The configuration file. `preserve_order` is not cosmetic: the relay reports
# every unusable value in the order it appears in the file, and an unordered map
# would scramble that into something an operator cannot follow back to a line.
# It resolves to `indexmap`, which the graph already carries.
toml = { version = "1.1.4", features = ["preserve_order"] }
# getuid/getgid for the "cannot write the config" hint, and uname for the startup
# banner. Both need a syscall std does not expose; rustix is the way to make them
# without putting the crate's first `unsafe` block in a diagnostic message.
rustix = { version = "1.1.4", features = ["process", "system"] }
# The Miniserver's configuration download (src/whitelist). A LoxCC container is
# LZ4 - block mode in practice, frame mode allowed for - wrapped in a CRC32, and
# sometimes inside a zip. lz4_flex does both modes in pure Rust and, unlike the C
# `lz4` crate, is compiled with the same `-C target-cpu` the rest of the binary
# gets. miniz_oxide is raw inflate for the zip case; the `zip` crate would pull
# aes, bzip2, zstd, lzma and zopfli in by default for one fixed entry we can read
# out of the central directory ourselves.
lz4_flex = "0.14.0"
crc32fast = "1.5.0"
miniz_oxide = "0.9.1"
# The configuration XML. Only one fixed query is ever run against it, so this is
# a streaming scan rather than a DOM - which is both faster on a 2.5 MB document
# and more tolerant of malformed input, since it can stop and keep what it has.
# That tolerance is the requirement: lxml read these files in recover mode.
quick-xml = "0.41.0"
# The filesystem API (/dev/fslist, /dev/fsget). Named rather than added: all
# three already resolve through loxwebsocket -> fastwebsockets, so the graph is
# unchanged. reqwest would have brought hyper-rustls alongside the tokio-rustls
# already here, and the one-crypto-provider pin above is worth more than the
# convenience - these two requests are plaintext HTTP and need no TLS at all.
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.4"
clap = { version = "4.6.6", features = ["derive", "env"] }
