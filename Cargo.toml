[package]
name = "loxmqttrelay"
version = "0.1.0"
edition = "2024"

[lib]
# The name of the native library. This is the name which will be used in Python to import the
# library (i.e. `import string_sum`). If you change this, you must also change the name of the
# `#[pymodule]` in `src/lib.rs`.
name = "loxmqttrelay"
# "cdylib" is necessary to produce a shared library for Python to import from.
#
# Downstream Rust code (including code in `bin/`, `examples/`, and `tests/`) will not be able
# to `use string_sum;` unless the "rlib" or "lib" crate type is also included, e.g.:
# crate-type = ["cdylib", "rlib"]
crate-type = ["cdylib"]

[features]
# On by default for the wheel: `extension-module` leaves libpython unlinked,
# which is right for a shared object Python loads but breaks `cargo test`, whose
# harness is an executable and has to resolve those symbols itself. setup.py
# turns it back on for the builds that ship.
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["auto-initialize"] }
pyo3-async-runtimes = { version = "0.28", features = ["attributes", "tokio-runtime"] }
regex = "1.12.3"
lru = "0.18.0"          # LRU cache
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
log = "0.4.32"
env_logger = "0.11.10"     
tokio = { version = "1.52.3", features = ["full"] }
base64 = "0.22.1"
# Pin the rustls crypto provider explicitly: exactly one is required, and `ring`
# builds without cmake/NASM on the ARM targets this ships to.
mqtt-glide = { version = "0.1.1", default-features = false, features = ["tls-rustls-ring"] }
arc-swap = "1.9"

[build-dependencies]
pyo3-build-config = "0.28.3"
